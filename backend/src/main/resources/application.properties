spring.application.name=streambid
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:15432/streambid}
spring.datasource.username=${POSTGRES_USER:streambid}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.flyway.enabled=true
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
