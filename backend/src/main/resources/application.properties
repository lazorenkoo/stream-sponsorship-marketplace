spring.application.name=streambid
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:15432/streambid}
spring.datasource.username=${POSTGRES_USER:streambid}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.flyway.enabled=true
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
twitch.enabled=${TWITCH_ENABLED:false}
twitch.client-id=${TWITCH_CLIENT_ID:}
twitch.client-secret=${TWITCH_CLIENT_SECRET:}
twitch.api-url=https://api.twitch.tv/helix
twitch.token-url=https://id.twitch.tv/oauth2/token
twitch.oauth.redirect-uri=${TWITCH_REDIRECT_URI:http://localhost:8080/api/channels/connect/twitch/callback}
security.token-encryption-key=${TOKEN_ENCRYPTION_KEY:}
twitch.validation.enabled=${TWITCH_VALIDATION_ENABLED:true}
twitch.validation.interval-ms=300000
